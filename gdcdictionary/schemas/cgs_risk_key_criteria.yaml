$schema: "http://json-schema.org/draft-04/schema#"

id: "cgs_risk_key_criteria"
title: CGS Risk Key Criteria
type: object
namespace: https://gdc.cancer.gov
category: clinical
project: '*'
program: '*'
description: >-
  Baseline patient-level Consensus Genomic Staging (CGS) risk classification
  and key criteria for high-risk multiple myeloma, as defined by the
  International Myeloma Society and International Myeloma Working Group.
additionalProperties: false
submittable: true
downloadable: true
previous_version_downloadable: true
validators: null

systemProperties:
  - id
  - project_id
  - created_datetime
  - updated_datetime
  - state

links:
  - name: cases
    backref: cgs_risk_key_criteria
    label: describes
    target_type: case
    multiplicity: one_to_one
    required: true

required:
  - submitter_id
  - type
  - cgs_risk_category
  - cases

uniqueKeys:
  - [id]
  - [project_id, submitter_id]

properties:

  $ref: "_definitions.yaml#/ubiquitous_properties"

  cgs_risk_category:
    $ref: "_terms.yaml#/cgs_risk_category/common"
    enum:
      - "High Risk"
      - "Standard Risk"
      - "High"
      - "Standard"
      - "NA"

  cgs_risk_criteria:
    $ref: "_terms.yaml#/cgs_risk_criteria/common"
    type: array
    minItems: 1
    uniqueItems: true
    items:
      enum:
        - "1. del(17p), with a cutoff of >20% clonal fraction, and/or TP53 mutation"
        - "2. an IgH translocation including t(4;14), t(14;16), or t(14;20) along with 1q+ and/or del(1p32)"
        - "3. monoallelic del(1p32) along with 1q+ or biallelic del(1p32)"
        - "4. β2 microglobulin ≥5.5 mg/L with normal creatinine (<1.2 mg/dL)"
        - "CGS Criterion 1: del(17p) >20% and/or TP53 mutation"
        - "CGS Criterion 2: high-risk translocation plus 1q gain/amplification or del(1p32)"
        - "CGS Criterion 3: monoallelic del(1p32) with 1q gain/amplification or biallelic del(1p32)"
        - "CGS Criterion 4: beta-2 microglobulin >=5.5 mg/L with creatinine <1.2 mg/dL"

  other_criteria:
    $ref: "_terms.yaml#/other_criteria/common"
    type: array
    minItems: 1
    uniqueItems: true
    items:
      enum:
        - "del(17p13) detected"
        - "del(17p13) not detected"
        - "TP53 mutation detected"
        - "TP53 mutation not detected"
        - "t(4;14) translocation detected"
        - "t(4;14) translocation not detected"
        - "t(14;16) translocation detected"
        - "t(14;16) translocation not detected"
        - "t(14;20) translocation detected"
        - "t(14;20) translocation not detected"
        - "1q gain/amplification detected"
        - "1q gain/amplification not detected"
        - "Monoallelic del(1p32) detected"
        - "Monoallelic del(1p32) not detected"
        - "Biallelic del(1p32) detected"
        - "Biallelic del(1p32) not detected"
        - "del(1p32) detected"
        - "del(1p32) not detected"
        - "β2 microglobulin ≥5.5 mg/L"
        - "β2 microglobulin <5.5 mg/L"
        - "Beta-2 microglobulin >=5.5 mg/L"
        - "Beta-2 microglobulin <5.5 mg/L"
        - "Creatinine <1.2 mg/dL"
        - "Creatinine >=1.2 mg/dL"

  cases:
    $ref: "_definitions.yaml#/to_one"
