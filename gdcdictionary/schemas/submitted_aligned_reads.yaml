$schema: "http://json-schema.org/draft-04/schema#"

id: "submitted_aligned_reads"
title: Submitted Aligned Reads
type: object
namespace: https://gdc.cancer.gov
category: data_file
project: '*'
program: '*'
description: >-
  Data file containing aligned reads that are used as input to GDC workflows.
additionalProperties: false
submittable: true
downloadable: true
previous_version_downloadable: true
validators: null

systemProperties:
  - id
  - project_id
  - created_datetime
  - updated_datetime
  - file_state
  - state
  - error_type

links:
  - exclusive: false
    required: true
    subgroup:
    - name: read_groups
      backref: submitted_aligned_reads_files
      label: data_from
      target_type: read_group
      multiplicity: one_to_many
      required: false
    - name: core_metadata_collections
      backref: submitted_aligned_reads_files
      label: data_from
      target_type: core_metadata_collection
      multiplicity: many_to_one
      required: false


required:
  - submitter_id
  - type
  - file_name
  - file_size
  - md5sum
  - data_category
  - data_format
  - data_type

uniqueKeys:
  - [id]
  - [project_id, submitter_id]

deprecated:
  - proc_internal

properties:

  $ref: "_definitions.yaml#/data_file_properties"

  data_category:
    $ref: "_terms.yaml#/data_category/common"
    enum:
      - Sequencing Reads
      - Chromatin Accessibility
      - Immune Repertoire

  data_type:
    $ref: "_terms.yaml#/data_type/common"
    enum:
      - Aligned Reads
      - Unaligned Reads

  data_format:
    $ref: "_terms.yaml#/data_format/common"
    enum:
      - BAM

  experimental_strategy:
    $ref: "_terms.yaml#/experimental_strategy/common"
    enum:
      - ATAC-Seq
      - Bisulfite-Seq
      - ChIP-Seq
      - HiChIP
      - m6A MeRIP-Seq
      - miRNA-Seq
      - RNA-Seq
      - scATAC-Seq
      - scBCR-Seq
      - scRNA-Seq
      - scTCR-Seq
      - Targeted Sequencing
      - WGS
      - WXS

##    deprecated_enum:
##      - scRNA-Seq
##    enumDef:
##      Targeted Sequencing:
##        $ref: "_terms_enum.yaml#/targeted_sequencing/common"
##      WGS:
##        $ref: "_terms_enum.yaml#/wgs/common"
##      WXS:
##        $ref: "_terms_enum.yaml#/wxs/common"

  proc_internal:
    $ref: "_terms.yaml#/proc_internal/common"
    enum:
      - dna-seq skip

  read_groups:
    $ref: "_definitions.yaml#/to_many"

  core_metadata_collections:
    description: The submitter_id or id of the core_metadata_collection to which the data_file belongs, i.e., a link to a record in the parent node.
    $ref: "_definitions.yaml#/to_one"
